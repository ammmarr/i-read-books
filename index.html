<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#fafafa" />
    <meta name="description" content="A calm, private PDF reader with highlights and reading analytics." />
    <title>I read</title>
    <script>
      // Apply the saved theme before first paint so there's no flash.
      try {
        var t = localStorage.getItem('irb-theme') || 'system'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        // Night Shift already on? Warm the boot screen as well (full logic in src/lib/nightShift.ts).
        var s = JSON.parse(localStorage.getItem('irb-settings') || '{}')
        var o = s.nightShiftOverride, d = new Date(), n = d.getHours() * 60 + d.getMinutes()
        var mm = function (x) { var p = String(x || '0:0').split(':'); return (+p[0] * 60 + +(p[1] || 0)) % 1440 }
        var a = mm(s.nightShiftFrom || '21:00'), b = mm(s.nightShiftTo || '07:00')
        var on = o && o.until > Date.now() ? o.on : s.nightShift === 'on' || (s.nightShift === 'scheduled' && a !== b && (a < b ? n >= a && n < b : n >= a || n < b))
        if (on) document.documentElement.classList.add('night-shift')
      } catch (e) {}
    </script>
    <style>
      /* Boot screen: the logo draws itself while the app starts (main.tsx fades it out). */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background: #0a0a0a;
        color: #ededed;
        transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s;
      }
      #boot.out {
        opacity: 0;
        visibility: hidden;
      }
      #boot svg {
        height: min(30vh, 170px);
        width: auto;
        overflow: visible;
      }
      .night-shift #boot {
        color: #f4c08a;
        --logo-glint: #ffb15a;
      }
      /*logo-css*/
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><!--boot-logo--></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
